# Rise MD Editor — release pipeline (RAISE-45).
#
# Triggers on `v*` tag pushes (the standard "cut a release" path) plus
# `workflow_dispatch` for dry-run testing without burning notary minutes.
#
# Jobs:
#   build-mac   macOS-14 runner. Universal binary (Intel + Apple Silicon),
#               full Developer ID code signing + notarization. Produces
#               .dmg + .zip + latest-mac.yml.
#   build-win   windows-latest runner. NSIS installer + portable .zip.
#               Signed via Azure Artifact Signing (RAISE-58); see
#               docs/azure-signing-setup.md and the build-win job below.
#   release     Aggregates artifacts and creates a draft GitHub Release
#               that the user reviews and publishes manually. Tag push
#               only — workflow_dispatch never publishes.
#
# `--publish never` is passed to electron-builder on every build so the
# build host never tries to upload directly. The dedicated release job
# does the upload via softprops/action-gh-release, which keeps the
# build hosts free of repo write tokens.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_signing:
        description: 'Skip macOS signing & notarization (dry-run smoke test)'
        type: boolean
        default: false

# softprops/action-gh-release writes Releases via the GitHub API, so the
# job needs `contents: write`. Build jobs only need read access (npm ci
# fetches public packages; checkout uses the default token).
permissions:
  contents: write

# Don't pile up parallel release runs for the same ref. Don't cancel a
# running release either — partial artifacts in a draft release are
# worse than waiting for the previous run to finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # macOS — full signing + notarization
  # ---------------------------------------------------------------------------
  build-mac:
    name: Build macOS (universal, signed + notarized)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build & sign macOS (universal)
        env:
          # Apple Developer ID Application cert as a base64-encoded .p12
          # plus its key password. electron-builder reads these directly:
          # https://www.electron.build/code-signing
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # Notarization (notarytool). All three are required — if any
          # is missing electron-builder logs a warning and ships a
          # signed-but-unnotarized DMG (Gatekeeper malware dialog on
          # first launch — DON'T release those).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # GH_TOKEN is unused on the `--publish never` path but
          # electron-builder warns when it isn't set on a tag build.
          # The default GITHUB_TOKEN has read access which is enough.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ inputs.skip_signing }}" == "true" ]]; then
            echo "::notice::skip_signing=true — building unsigned macOS DMG (no notarization)"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          npm run build:mac -- --publish never

      - name: Verify signature & notarization
        if: ${{ inputs.skip_signing != true }}
        run: |
          # Find the universal .app bundle and confirm Gatekeeper accepts it.
          APP_PATH=$(find dist -name '*.app' -maxdepth 3 -type d | head -1)
          if [[ -z "$APP_PATH" ]]; then
            echo "::error::No .app bundle found under dist/"
            exit 1
          fi
          echo "Inspecting: $APP_PATH"
          codesign -dvv "$APP_PATH" 2>&1 | head -15
          # `spctl --assess` returns "accepted" + "source=Notarized Developer ID"
          # when notarization succeeded and the staple landed.
          spctl --assess --type execute --verbose=4 "$APP_PATH" 2>&1

      - uses: actions/upload-artifact@v7
        with:
          name: mac-artifacts
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Windows — signed via Azure Artifact Signing (RAISE-58)
  # ---------------------------------------------------------------------------
  #
  # Azure rebranded "Trusted Signing" to "Artifact Signing" in the
  # portal UI. Microsoft Learn docs and many third-party tutorials
  # still use the old name; the NuGet package and DLL retain
  # `Trusted.Signing` / `CodeSigning` literals. Full setup recipe
  # in docs/azure-signing-setup.md.
  #
  # Auth: OIDC federation between GitHub Actions and the Entra app
  # registration `rise-md-editor-github-signing`. The `id-token: write`
  # permission below lets the runner mint an OIDC token; the
  # `environment:` declaration scopes the federated credential so only
  # this job (and other jobs that opt into the same environment) can
  # exchange it for Azure access. No long-lived secrets on the runner.
  #
  # Signing flow:
  #   1. azure/login@v3 exchanges the OIDC token for an Azure access
  #      token and writes it to the standard credential locations the
  #      .NET DefaultAzureCredential picks up.
  #   2. The Artifact Signing dlib (NuGet package
  #      `Microsoft.Trusted.Signing.Client`) is installed and its
  #      path captured for the sign callback.
  #   3. A metadata JSON file is written, naming the Artifact Signing
  #      account + cert profile to sign against.
  #   4. electron-builder runs the normal `--win` build; its
  #      `signtoolOptions.sign` callback (scripts/sign-windows.cjs)
  #      invokes signtool.exe with the dlib for every .exe.
  build-win:
    name: Build Windows (signed via Azure Artifact Signing)
    # `windows-latest` is GitHub's rolling label — it points at the
    # newest stable Windows runner image. Migrations happen
    # automatically (e.g. the windows-2022 → windows-2025-vs2026
    # transition on 2026-06-15). The "Locate signtool.exe" step
    # below globs for the Windows SDK install path so the build
    # survives those migrations. If signing breaks after a runner
    # image change, that's the first place to look — the SDK may
    # have moved to a new versioned directory.
    runs-on: windows-latest
    timeout-minutes: 30
    # OIDC token minting requires id-token: write. contents: read is
    # the default for any checkout-using job; spelled out for clarity.
    permissions:
      id-token: write
      contents: read
    # Environment-gated signing access. The Entra app registration's
    # federated credential is keyed to this environment name — only
    # workflow runs that declare `environment: rise-md-editor-signing`
    # can exchange their OIDC token for the cert-profile signing role.
    # Configure protection rules (allowed branches/tags) on the
    # environment in GitHub Settings if you want to gate signing on
    # specific refs (e.g. v* tags only).
    environment: rise-md-editor-signing
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Microsoft's Artifact Signing dlib is a .NET assembly. The
      # windows-latest runner already has .NET SDKs preinstalled,
      # but pinning here keeps the workflow stable against runner
      # image churn.
      - name: Set up .NET (for the Artifact Signing dlib)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # Install the Artifact Signing client NuGet package and capture
      # the path to Azure.CodeSigning.Dlib.dll. (The NuGet package
      # name retains the older `Trusted.Signing` literal — that's
      # outside our control.) Version is pinned to a known-good
      # release; bump deliberately and verify against
      # https://www.nuget.org/packages/Microsoft.Trusted.Signing.Client
      # before merging. The dlib path is resolved by globbing rather
      # than string-templating the version, so a future version bump
      # only needs the version constant updated above this comment.
      - name: Install Artifact Signing dlib
        shell: pwsh
        run: |
          $packageVersion = '1.0.95'  # latest as of 2026-05; bump after verifying on nuget.org
          nuget install Microsoft.Trusted.Signing.Client -Version $packageVersion -OutputDirectory "$env:RUNNER_TEMP\artifact-signing"
          # Glob for the dlib — the file path includes the version
          # number, so resolving by search keeps the lookup decoupled
          # from the pin above. -Recurse handles the bin/x64/ subpath
          # without us hardcoding it.
          $dlib = Get-ChildItem -Path "$env:RUNNER_TEMP\artifact-signing" -Recurse -Filter 'Azure.CodeSigning.Dlib.dll' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dlib) {
            Write-Error "Azure.CodeSigning.Dlib.dll not found anywhere under $env:RUNNER_TEMP\artifact-signing. NuGet install probably failed silently — scroll up for diagnostics."
            Get-ChildItem -Path "$env:RUNNER_TEMP\artifact-signing" -Recurse | Select-Object -First 30 FullName
            exit 1
          }
          "AZURE_ARTIFACT_SIGNING_DLIB_PATH=$($dlib.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "Dlib path: $($dlib.FullName)"

      # The dlib reads account + cert-profile config from a JSON file
      # path passed to signtool's /dmdf flag. Endpoint and names are
      # NOT secrets — they're just config — so we keep them in the
      # workflow YAML for visibility.
      # signtool.exe ships with the Windows SDK (preinstalled on
      # windows-latest), but the SDK's versioned bin directory isn't
      # on PATH. Resolve the latest installed copy and export its
      # full path via $GITHUB_ENV so the sign callback can invoke it
      # without relying on PATH lookup.
      - name: Locate signtool.exe
        shell: pwsh
        run: |
          # Windows Kits 10 install paths are reasonably stable. Look
          # under both Program Files (x86) (host-arch-independent) and
          # Program Files for completeness. The version directories
          # sort lexically in version order (5-digit components mean
          # 10.0.22621 > 10.0.19041 correctly).
          $candidates = @(
            "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe",
            "C:\Program Files\Windows Kits\10\bin\*\x64\signtool.exe"
          )
          $signtool = $null
          foreach ($pattern in $candidates) {
            $found = Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue | Sort-Object -Property FullName -Descending | Select-Object -First 1
            if ($found) {
              $signtool = $found
              break
            }
          }
          if (-not $signtool) {
            Write-Error "signtool.exe not found under any Windows Kits 10 bin directory. Runner image may have changed; check actions/runner-images for the current SDK install path."
            exit 1
          }
          "SIGNTOOL_PATH=$($signtool.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "signtool.exe: $($signtool.FullName)"

      - name: Write Artifact Signing metadata
        shell: pwsh
        run: |
          $metadataPath = "$env:RUNNER_TEMP\artifact-signing-metadata.json"
          @'
          {
            "Endpoint": "https://eus.codesigning.azure.net/",
            "CodeSigningAccountName": "rise-md-editor-signing",
            "CertificateProfileName": "rise-md-editor-public"
          }
          '@ | Out-File -Encoding utf8 $metadataPath
          "AZURE_ARTIFACT_SIGNING_METADATA_PATH=$metadataPath" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "Metadata path: $metadataPath"

      # Exchange the GitHub OIDC token for an Azure access token.
      # DefaultAzureCredential (used internally by the dlib) reads
      # the resulting AZURE_* env vars / credential cache that
      # azure/login populates. No client secret in the secrets store.
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build & sign Windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:win -- --publish never

      # Quick verification — Get-AuthenticodeSignature reads the
      # embedded signature from the .exe and surfaces the signer's
      # subject name. If signing silently failed (e.g. dlib couldn't
      # reach Azure), this would be NotSigned and the step would fail
      # the job. SignerCertificate.Subject contains the cert subject
      # (e.g. "CN=Rise People Inc, O=...").
      - name: Verify signature on the installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter '*-Setup.exe' | Select-Object -First 1
          if (-not $installer) {
            Write-Error "No NSIS installer found under dist/"
            exit 1
          }
          $sig = Get-AuthenticodeSignature $installer.FullName
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          Write-Host "Status: $($sig.Status)"
          if ($sig.Status -ne 'Valid') {
            Write-Error "Signature status is $($sig.Status); expected Valid"
            exit 1
          }

      - uses: actions/upload-artifact@v7
        with:
          name: win-artifacts
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Release — aggregate artifacts into a draft GitHub Release
  # ---------------------------------------------------------------------------
  #
  # Tag push only. workflow_dispatch runs the build jobs (smoke test) but
  # never publishes — the `if` here ensures that. The release is created
  # as a DRAFT so a human reviews artifact list + autogenerated notes
  # before flipping it to public.
  release:
    name: Publish draft GitHub Release
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          name: Rise MD Editor ${{ github.ref_name }}
          files: |
            dist/**/*.dmg
            dist/**/*.zip
            dist/**/*.exe
            dist/**/*.blockmap
            dist/**/latest-mac.yml
            dist/**/latest.yml
          body: |
            ## Rise MD Editor ${{ github.ref_name }}

            Automated build via GitHub Actions ([workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})).

            ### Artifacts
            - **macOS** (`.dmg` + `.zip`): universal binary, Developer ID signed, Apple notarized. Drag to /Applications.
            - **Windows** (`.exe` + `.zip`): NSIS installer, signed via [Azure Artifact Signing](https://learn.microsoft.com/en-us/azure/trusted-signing/) (Microsoft-rooted trust chain). Publisher: Rise People Inc.

            ### Auto-update
            Existing installs receive this version automatically via electron-updater on next launch.
