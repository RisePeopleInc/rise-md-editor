<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rAIse</title>

    <!--
      Rise brand fonts ([RAISE-16](https://risepeople.atlassian.net/browse/RAISE-16))
      are bundled via `@fontsource` (woff2 files imported from
      `src/renderer/main.tsx` and processed by Vite's asset pipeline).
      Previous incarnation pulled them from Google Fonts CDN with
      preconnect + font-display=swap; on a cold offline launch that
      meant a brief flash of the system serif fallback (Georgia)
      before the network fetch completed and the swap kicked in.
      Bundling makes first paint hit Source Serif Pro / Open Sans
      immediately, no flash, no network dependency.
    -->

    <!--
      Bootstrap script: read the persisted theme preference (set by main
      via electron-store and copied onto the document by App.tsx after
      first render) and apply the data-theme attribute BEFORE first paint
      so users who chose dark mode don't see a flash of light surfaces on
      launch. We can't read electron-store synchronously here (no Node
      access from the sandboxed renderer); instead main writes the most
      recent theme onto the window via a CLI-ish localStorage shim that
      survives reloads. Falls back to matchMedia when no preference exists.
    -->
    <script>
      (function () {
        try {
          // The 'rise-theme' key MUST stay in sync with
          // `BOOT_STORAGE_KEY` in src/renderer/state/themeState.ts —
          // the hook writes it on every theme change so this script
          // can read the last resolved value on next launch.
          var stored = localStorage.getItem('rise-theme'); // 'light' | 'dark'
          var resolved;
          if (stored === 'light' || stored === 'dark') {
            resolved = stored;
          } else {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
