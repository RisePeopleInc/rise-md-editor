# RAISE-12: production build configuration.
#
# Most cross-platform metadata is consolidated here so the platform
# targets only differ where they have to (icons, file associations,
# code-signing setup). Every change here should keep `npm run dev`
# working — it doesn't read this file but does share `out/` with the
# electron-builder pipeline.

appId: com.risepeople.rise-md-editor
productName: Rise MD Editor
copyright: © 2026 Rise People

directories:
  buildResources: build
  output: dist

files:
  - out/**/*
  - package.json
  - '!**/*.{md,map}'

asar: true

# ---------------------------------------------------------------------------
# Auto-update via GitHub Releases.
#
# `electron-updater` reads `publish` to know where to look for new
# release artifacts. The `latest-{platform}.yml` files that
# electron-builder generates alongside each installer are uploaded to
# the release; the updater fetches them on launch and compares versions.
#
# Public repo means no auth required for downloads. For private repos
# the updater needs a GH_TOKEN at runtime.
# ---------------------------------------------------------------------------
publish:
  provider: github
  owner: RisePeopleInc
  repo: rise-md-editor

# ---------------------------------------------------------------------------
# File associations (RAISE-44).
#
# Claims the markdown extension family on every platform — Finder
# "Open With" submenu on macOS, Explorer "Open with" / Default Apps
# on Windows, and .desktop MIME-type registration on Linux. Drag
# onto the dock, right-click → Open With, and double-click-from-
# Finder all flow through to `app.on('open-file')` (macOS) or
# `process.argv` (Win / Linux), dispatched as `open-path` actions
# in `main/index.ts`.
#
# The extension list deliberately omits:
#
#   - `.txt` — too generic. Claiming it would steal the system
#     default for plain text from TextEdit / Notepad / etc., which
#     no user is asking for. (We still ACCEPT `.txt` in
#     `findFileArgs` for the rare user who manually sets us as
#     default for it — registering the claim is what's avoided.)
#
#   - `.mdx` — MDX (markdown + JSX) is a separate ecosystem with
#     editors that understand JSX. Let those tools claim it.
#
# electron-builder generates the macOS `CFBundleDocumentTypes` +
# `UTImportedTypeDeclarations` plist blocks, the Windows NSIS
# installer registry entries (per-user `HKCU`, no admin elevation
# needed — matches VS Code's default), and the Linux `.desktop`
# MimeType field from this one block.
#
# File icon (RAISE-65): each entry points at `build/file-icons/md`
# (extension-less). electron-builder appends `.icns` on macOS and
# `.ico` on Windows automatically, so Finder / Explorer show the
# Rise-branded document icon (orange double-ring on a page) for these
# files. This is the DOCUMENT icon, distinct from the APP icon
# (`build/icon.png`). Regenerate the binaries from the SVG source with
# `scripts/generate-file-icons.sh` after editing
# `build/file-icons/md.svg`.
# ---------------------------------------------------------------------------
fileAssociations:
  - ext: md
    name: Markdown Document
    description: Markdown source file
    role: Editor
    rank: Default
    mimeType: text/markdown
    icon: build/file-icons/md
  - ext: markdown
    name: Markdown Document
    description: Markdown source file
    role: Editor
    rank: Default
    mimeType: text/markdown
    icon: build/file-icons/md
  - ext: mdown
    name: Markdown Document
    role: Editor
    mimeType: text/markdown
    icon: build/file-icons/md
  - ext: mkd
    name: Markdown Document
    role: Editor
    mimeType: text/markdown
    icon: build/file-icons/md
  - ext: mkdn
    name: Markdown Document
    role: Editor
    mimeType: text/markdown
    icon: build/file-icons/md
  - ext: mdwn
    name: Markdown Document
    role: Editor
    mimeType: text/markdown
    icon: build/file-icons/md
  - ext: mdtxt
    name: Markdown Document
    role: Editor
    mimeType: text/markdown
    icon: build/file-icons/md
  - ext: mdtext
    name: Markdown Document
    role: Editor
    mimeType: text/markdown
    icon: build/file-icons/md

# ---------------------------------------------------------------------------
# Icons live in build/. icon.svg is the design source (Rise mark on a
# white rounded square); icon.png is the 1024×1024 rendered bitmap that
# electron-builder reads to auto-generate .icns / .ico at build time.
# To update the design, edit icon.svg then re-run the resvg-js CLI
# documented in README.md — only icon.png needs to be on disk for the
# build to consume.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# macOS
# ---------------------------------------------------------------------------
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  # Artifact name for mac targets (covers the .zip, which doesn't get a
  # target-specific override below; dmg.artifactName overrides this for
  # the DMG specifically). Hard-coding `Rise-MD-Editor` rather than
  # using `${productName}` because productName has spaces ("Rise MD
  # Editor") and electron-builder's YAML serializer writes URLs with
  # hyphens while GitHub Releases stores uploaded assets with dots —
  # the resulting mismatch made `latest-mac.yml`'s download paths 404
  # against the actual asset names, breaking auto-update silently. See
  # the v0.1.4 release-cycle post-mortem in CHANGELOG.
  artifactName: Rise-MD-Editor-${version}-${arch}-mac.${ext}
  # Universal binary — runs natively on both Intel and Apple Silicon
  # from a single .dmg. Larger file, but only one artifact to ship.
  target:
    - target: dmg
      arch: universal
    # RAISE-91: signed + notarized .pkg for managed deployment (IT pushes
    # this to Macs via device management — Jamf / Kandji / Munki /
    # Intune-for-Mac). Installs the app per-machine into /Applications.
    # This is the macOS counterpart to the Windows MSI (RAISE-90) and an
    # ADDITIONAL artifact: the .dmg above stays the auto-updating build for
    # direct end-user downloads. The .pkg deliberately does NOT self-update
    # (the app gates electron-updater off when /Applications isn't
    # user-writable — see src/main/autoUpdater.ts). Signed with the
    # Developer ID *Installer* cert (distinct from the Application cert used
    # for the .app/.dmg) via CSC_INSTALLER_LINK in the release workflow.
    - target: pkg
      arch: universal
    - target: zip
      arch: universal
  # Code signing.
  #
  # `identity` here is the human-readable name portion of the
  # Developer ID Application certificate's Common Name. electron-builder
  # automatically prepends "Developer ID Application:" — including the
  # prefix here causes the build to fail with "Please remove prefix...".
  # On a build host that has this cert + the matching private key in
  # its Keychain (see README "Code signing setup"), electron-builder
  # finds the identity by name and signs the .app bundle.
  #
  # If the cert isn't in the Keychain, set
  # `CSC_IDENTITY_AUTO_DISCOVERY=false` in the environment to skip
  # signing entirely — useful for CI smoke builds without secrets.
  # Without that env var, the build will fail with "no identity found".
  #
  # https://www.electron.build/code-signing
  identity: 'Rise People Inc (TJFLUA3UJ3)'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarization.
  #
  # Without notarization, signed-but-unnotarized apps still trigger
  # Gatekeeper's "Apple could not verify Rise MD Editor is free of
  # malware" dialog on first launch (Catalina+). With notarization, Apple's
  # notary service scans the bundle, returns a ticket, and
  # electron-builder staples it to the DMG so the dialog becomes
  # "macOS verified that this app is free of malware" with an Open
  # button — clean install UX.
  #
  # All notarization config is driven by env vars (no `notarize:` block
  # here) — recent electron-builder versions warn if you ALSO set
  # `notarize.teamId` in the config file because it can drift out of
  # sync with the env var that notarytool actually uses:
  #
  #   APPLE_ID                   — Apple ID enrolled in the Developer Program
  #                                (techpurchasing@risepeople.com for Rise)
  #   APPLE_APP_SPECIFIC_PASSWORD — generated at appleid.apple.com → Sign-In
  #                                and Security → App-Specific Passwords.
  #                                Stored in 1Password — NEVER in dotfiles.
  #   APPLE_TEAM_ID              — TJFLUA3UJ3 (matches the signing cert)
  #
  # If any are missing electron-builder will warn and skip notarization
  # (build still produces a signed-but-unnotarized DMG — handy for
  # local smoke tests, but those builds will trigger the Gatekeeper
  # malware dialog on end-user machines).
  #
  # https://www.electron.build/configuration/mac#MacConfiguration-notarize

dmg:
  # See the comment on `mac.artifactName` above for why this is hard-coded
  # to `Rise-MD-Editor` rather than `${productName}`.
  artifactName: Rise-MD-Editor-${version}-${arch}.${ext}

# RAISE-91: MSI's macOS twin — the .pkg installer for MDM deployment.
pkg:
  # Install the app bundle straight into /Applications (system-wide), which
  # is what MDM expects and what makes the app available to every user on
  # the managed device.
  installLocation: /Applications
  # Don't let the installer relocate an existing copy found elsewhere on
  # disk — MDM wants a deterministic /Applications install, not a move of
  # whatever stray bundle Spotlight happens to find.
  isRelocatable: false
  # Per-machine: no "install for me only" option. The whole point is a
  # system-context deploy.
  isVersionChecked: true
  # Artifact name comes from `mac.artifactName` above → the pkg is emitted
  # as `Rise-MD-Editor-${version}-universal-mac.pkg` (the .dmg overrides to
  # drop the `-mac` suffix via `dmg.artifactName`; the pkg keeps the
  # generic mac name).

# ---------------------------------------------------------------------------
# Windows
# ---------------------------------------------------------------------------
win:
  icon: build/icon.png
  # Artifact name for win targets — covers the .zip (nsis.artifactName
  # overrides this for the installer). See the comment on
  # `mac.artifactName` above for why this is hard-coded.
  artifactName: Rise-MD-Editor-${version}-win.${ext}
  target:
    - target: nsis
      arch: x64
    # RAISE-90: MSI for managed deployment (IT pushes this to user
    # machines via Microsoft Intune). Intune detects install state from
    # the MSI product code — no hand-authored detection rules — and
    # installs it per-machine in the system context. This is an ADDITIONAL
    # artifact: NSIS above stays the auto-updating build for direct
    # end-user downloads; the MSI deliberately does NOT self-update (the
    # app gates electron-updater off for per-machine installs — see
    # `src/main/autoUpdater.ts` — because Program Files isn't user-writable
    # and Intune owns the version). Built via the WiX toolchain that
    # electron-builder fetches on demand; signed by the same
    # `signtoolOptions.sign` callback as the .exe (it's path-agnostic).
    - target: msi
      arch: x64
    - target: zip
      arch: x64
  # Code signing via Azure Artifact Signing (RAISE-58).
  #
  # Azure rebranded "Trusted Signing" to "Artifact Signing" in the
  # portal UI; Microsoft Learn docs may still use the old name. The
  # NuGet package + DLL retain `Trusted.Signing` / `CodeSigning`
  # literal names — those aren't ours to rename. Full setup recipe:
  # `docs/azure-signing-setup.md`.
  #
  # `signtoolOptions.sign` is invoked by electron-builder for every
  # `.exe` it produces during the build — the unpacked app, helper
  # exes (e.g. `elevate.exe`), the uninstaller stub, and the final
  # NSIS installer. The callback in `scripts/sign-windows.cjs` shells
  # out to `signtool.exe` (Windows SDK, pre-installed on
  # `windows-latest` runners) with the Artifact Signing dlib, which
  # delegates the actual signing to Microsoft's HSM-hosted cert.
  #
  # The CI workflow `.github/workflows/release.yml` sets two env vars
  # the callback reads:
  #   AZURE_ARTIFACT_SIGNING_DLIB_PATH       — abs path to
  #                                            Azure.CodeSigning.Dlib.dll
  #   AZURE_ARTIFACT_SIGNING_METADATA_PATH   — abs path to the JSON
  #                                            describing endpoint
  #                                            + account + cert profile
  #
  # When either env var is missing (local `npm run build:win` without
  # Azure auth), the callback logs a "skipping" warning and returns
  # — producing an unsigned `.exe`. Matches the pre-RAISE-58 behavior
  # for local dev. See docs/release-process.md "Windows signing".
  #   https://www.electron.build/code-signing#windows
  #   https://learn.microsoft.com/en-us/azure/trusted-signing/
  signtoolOptions:
    sign: ./scripts/sign-windows.cjs
    signingHashAlgorithms: [sha256]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # See the comment on `mac.artifactName` above for why this is hard-coded.
  artifactName: Rise-MD-Editor-${version}-Setup.${ext}

# RAISE-90: MSI options for the Intune-deployed build.
msi:
  # Per-machine (system context) install — Intune runs the MSI as SYSTEM
  # and the app must be available to every user on the device. This is the
  # whole reason for the MSI; it also lands the app in Program Files, which
  # is the signal the auto-updater uses to disable itself for this build.
  perMachine: true
  # oneClick stays at its default (true): Intune drives a silent install
  # (`msiexec /i ... /qn`), so there's no wizard to show regardless.
  # upgradeCode is left to electron-builder, which derives a stable GUID
  # from appId — successive versions share it, so Intune supersedes a prior
  # install cleanly instead of installing side-by-side.
  #
  # Artifact name comes from `win.artifactName` above → the MSI is emitted
  # as `Rise-MD-Editor-${version}-win.msi` (the .exe overrides to -Setup via
  # `nsis.artifactName`; the MSI keeps the generic win name).

# ---------------------------------------------------------------------------
# Linux
# ---------------------------------------------------------------------------
linux:
  icon: build/icon.png
  category: Office
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64

appImage:
  # See the comment on `mac.artifactName` above for why this is hard-coded.
  artifactName: Rise-MD-Editor-${version}.${ext}
