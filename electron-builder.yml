# RAISE-12: production build configuration.
#
# Most cross-platform metadata is consolidated here so the platform
# targets only differ where they have to (icons, file associations,
# code-signing setup). Every change here should keep `npm run dev`
# working — it doesn't read this file but does share `out/` with the
# electron-builder pipeline.

appId: com.risepeople.rise-md-editor
productName: Rise MD Editor
copyright: © 2026 Rise People

directories:
  buildResources: build
  output: dist

files:
  - out/**/*
  - package.json
  - '!**/*.{md,map}'

asar: true

# ---------------------------------------------------------------------------
# Auto-update via GitHub Releases.
#
# `electron-updater` reads `publish` to know where to look for new
# release artifacts. The `latest-{platform}.yml` files that
# electron-builder generates alongside each installer are uploaded to
# the release; the updater fetches them on launch and compares versions.
#
# Public repo means no auth required for downloads. For private repos
# the updater needs a GH_TOKEN at runtime.
# ---------------------------------------------------------------------------
publish:
  provider: github
  owner: RisePeopleInc
  repo: rise-md-editor

# ---------------------------------------------------------------------------
# File associations — registers Rise MD Editor as a handler for .md /
# .markdown / .txt on all platforms. Drag onto the dock, right-click →
# Open With, and double-click-from-Finder all flow through.
# ---------------------------------------------------------------------------
fileAssociations:
  - ext: md
    name: Markdown Document
    role: Editor
  - ext: markdown
    name: Markdown Document
    role: Editor
  - ext: txt
    name: Text Document
    role: Editor

# ---------------------------------------------------------------------------
# Icons live in build/. icon.svg is the design source (Rise mark on a
# white rounded square); icon.png is the 1024×1024 rendered bitmap that
# electron-builder reads to auto-generate .icns / .ico at build time.
# To update the design, edit icon.svg then re-run the resvg-js CLI
# documented in README.md — only icon.png needs to be on disk for the
# build to consume.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# macOS
# ---------------------------------------------------------------------------
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  # Universal binary — runs natively on both Intel and Apple Silicon
  # from a single .dmg. Larger file, but only one artifact to ship.
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  # Code signing.
  #
  # `identity` here is the human-readable name portion of the
  # Developer ID Application certificate's Common Name. electron-builder
  # automatically prepends "Developer ID Application:" — including the
  # prefix here causes the build to fail with "Please remove prefix...".
  # On a build host that has this cert + the matching private key in
  # its Keychain (see README "Code signing setup"), electron-builder
  # finds the identity by name and signs the .app bundle.
  #
  # If the cert isn't in the Keychain, set
  # `CSC_IDENTITY_AUTO_DISCOVERY=false` in the environment to skip
  # signing entirely — useful for CI smoke builds without secrets.
  # Without that env var, the build will fail with "no identity found".
  #
  # https://www.electron.build/code-signing
  identity: 'Rise People Inc (TJFLUA3UJ3)'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarization.
  #
  # Without notarization, signed-but-unnotarized apps still trigger
  # Gatekeeper's "Apple could not verify Rise MD Editor is free of
  # malware" dialog on first launch (Catalina+). With notarization, Apple's
  # notary service scans the bundle, returns a ticket, and
  # electron-builder staples it to the DMG so the dialog becomes
  # "macOS verified that this app is free of malware" with an Open
  # button — clean install UX.
  #
  # Required env vars on the build host:
  #   APPLE_ID                   — Apple ID enrolled in the Developer Program
  #                                (techpurchasing@risepeople.com for Rise)
  #   APPLE_APP_SPECIFIC_PASSWORD — generated at appleid.apple.com → Sign-In
  #                                and Security → App-Specific Passwords.
  #                                Stored in 1Password — NEVER in dotfiles.
  #   APPLE_TEAM_ID              — TJFLUA3UJ3 (matches the signing cert)
  #
  # If any are missing electron-builder will warn and skip notarization
  # (build still produces a signed-but-unnotarized DMG — handy for
  # local smoke tests, but those builds will trigger the Gatekeeper
  # malware dialog on end-user machines).
  #
  # https://www.electron.build/configuration/mac#MacConfiguration-notarize
  notarize:
    teamId: TJFLUA3UJ3

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

# ---------------------------------------------------------------------------
# Windows
# ---------------------------------------------------------------------------
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64
  # Code signing.
  #
  # Set CSC_LINK / CSC_KEY_PASSWORD with a code-signing cert (.pfx).
  # SmartScreen will quarantine unsigned installers on first download
  # for new users.
  #   https://www.electron.build/code-signing#windows

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-Setup.${ext}

# ---------------------------------------------------------------------------
# Linux
# ---------------------------------------------------------------------------
linux:
  icon: build/icon.png
  category: Office
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64

appImage:
  artifactName: ${productName}-${version}.${ext}
