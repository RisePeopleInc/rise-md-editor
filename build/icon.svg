<?xml version="1.0" encoding="UTF-8"?>
<!--
  RAISE-12 placeholder app icon — design source.

  Solid Gruvbox blue (#458588) rounded square with "rAIse" in white
  Source Serif Pro Bold. Per the spec this is interim — RAISE-15 will
  replace with the real Rise mark. The platform-specific exports
  (.icns / .ico) are auto-generated by electron-builder from
  build/icon.png, so the only artifact that needs to be regenerated
  here is the PNG (and only when the design changes).

  To regenerate build/icon.png from this SVG:
    npx --yes @resvg/resvg-js-cli build/icon.svg build/icon.png -w 1024
  or any tool of your choice (Inkscape, ImageMagick, an online
  converter — the result just needs to be 1024×1024 PNG).
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1024 1024"
     width="1024" height="1024">
  <rect x="0" y="0" width="1024" height="1024" rx="180" ry="180" fill="#458588" />
  <text x="512" y="600"
        text-anchor="middle"
        font-family="'Source Serif Pro', 'Source Serif 4', Georgia, serif"
        font-weight="700"
        font-size="380"
        fill="#ffffff">rAIse</text>
</svg>
