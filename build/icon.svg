<?xml version="1.0" encoding="UTF-8"?>
<!--
  Rise MD Editor app icon. Uses the Rise mark from
  @risepeopleinc/rcl/dist/collection/assets/platform/rise-logo.svg —
  the canonical orange (#FFA31D) double-ring logo — on a white
  rounded square background.

  Sizing follows Apple's macOS App Icon template (RAISE-15): the
  white squircle is 824x824 centred in a 1024x1024 canvas, leaving
  100px of transparent margin on each side. macOS uses that margin
  for shadow / depth effects; without it, the icon renders visibly
  larger than apps following Apple's guidance and looks
  proportionally oversized in the dock next to system apps.

  Math:
    Squircle: 824 x 824, top-left at (100, 100), corner radius 145
      (Apple's recommended corner is ~17.6% of the squircle size,
      matching the macOS Big Sur squircle convention).
    Mark: 75% of the squircle = 618 x 618, top-left at (203, 203)
      (squircle origin 100 + (824 - 618) / 2 = 100 + 103 = 203).
      The source mark is 24 x 24 — scale factor is 618 / 24 = 25.75.

  To regenerate build/icon.png from this SVG (see README — the
  resvg-js CLI takes a fit-width flag).

  Electron-builder generates the platform-specific .icns / .ico from
  the resulting icon.png at build time, no manual export needed.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1024 1024"
     width="1024" height="1024">
  <rect x="100" y="100" width="824" height="824" rx="145" ry="145" fill="#ffffff" />
  <g transform="translate(203, 203) scale(25.75)">
    <path fill-rule="evenodd" clip-rule="evenodd"
          d="M12 24C18.6274 24 24 18.6274 24 12C24 5.37258 18.6274 0 12 0C5.37258 0 0 5.37258 0 12C0 18.6274 5.37258 24 12 24ZM12 20C16.4183 20 20 16.4183 20 12C20 7.58172 16.4183 4 12 4C7.58172 4 4 7.58172 4 12C4 16.4183 7.58172 20 12 20Z"
          fill="#FFA31D" />
    <path opacity="0.5" fill-rule="evenodd" clip-rule="evenodd"
          d="M12 24C18.6274 24 24 18.6274 24 12C24 5.37258 18.6274 0 12 0C5.37258 0 0 5.37258 0 12C0 18.6274 5.37258 24 12 24ZM12 17C14.7614 17 17 14.7614 17 12C17 9.23858 14.7614 7 12 7C9.23858 7 7 9.23858 7 12C7 14.7614 9.23858 17 12 17Z"
          fill="#FFA31D" />
  </g>
</svg>
